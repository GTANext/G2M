<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G2M Loading</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --card-bg: rgba(10, 15, 30, 0.78);
      --card-border: rgba(148, 163, 184, 0.18);
      --text-main: #f8fafc;
      --text-muted: rgba(226, 232, 240, 0.78);
      --text-soft: rgba(148, 163, 184, 0.92);
      --accent-a: #38bdf8;
      --accent-b: #818cf8;
      --accent-c: #c084fc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
      color: var(--text-main);
    }

    .shell {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 22px;
      background: transparent;
    }

    .card {
      position: relative;
      width: min(100%, 392px);
      padding: 34px 30px 28px;
      border-radius: 30px;
      border: 1px solid var(--card-border);
      background:
        radial-gradient(circle at top, rgba(129, 140, 248, 0.16), transparent 44%),
        radial-gradient(circle at bottom right, rgba(56, 189, 248, 0.12), transparent 36%),
        linear-gradient(180deg, rgba(15, 23, 42, 0.9), var(--card-bg));
      /* box-shadow:
        0 32px 90px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.08); */
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(6px);
      opacity: 0.55;
      pointer-events: none;
    }

    .card::before {
      top: -46px;
      right: -18px;
      width: 120px;
      height: 120px;
      background: rgba(129, 140, 248, 0.18);
    }

    .card::after {
      bottom: -40px;
      left: -12px;
      width: 110px;
      height: 110px;
      background: rgba(56, 189, 248, 0.12);
    }

    .orb {
      position: relative;
      width: 78px;
      height: 78px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(56, 189, 248, 0.3), rgba(129, 140, 248, 0.24) 55%, rgba(192, 132, 252, 0.22)),
        rgba(15, 23, 42, 0.84);
      box-shadow:
        0 18px 40px rgba(79, 70, 229, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .orb::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 30px;
      border: 1px solid rgba(129, 140, 248, 0.22);
      animation: pulse 2.2s ease-in-out infinite;
    }

    .orb img {
      width: 42px;
      height: 42px;
      filter: drop-shadow(0 8px 16px rgba(129, 140, 248, 0.18));
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-soft);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-align: center;
    }

    p {
      margin: 12px auto 0;
      max-width: 260px;
      font-size: 14px;
      line-height: 1.7;
      text-align: center;
      color: var(--text-muted);
    }

    .progress {
      position: relative;
      margin-top: 26px;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .progress::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-a), var(--accent-b) 58%, var(--accent-c));
      box-shadow: 0 0 24px rgba(129, 140, 248, 0.45);
      animation: loading 1.45s ease-in-out infinite;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(148, 163, 184, 0.88);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent-a), var(--accent-c));
      box-shadow: 0 0 14px rgba(129, 140, 248, 0.75);
      animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes loading {
      0% {
        transform: translateX(-125%);
      }

      100% {
        transform: translateX(285%);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.35;
        transform: scale(0.98);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.04);
      }
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.45;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-label="G2M splash screen">
      <div class="orb">
        <img src="/images/logo.svg" alt="G2M" />
      </div>
      <div class="eyebrow">GTAMODX Manager</div>
      <h1>G2M</h1>
      <p>正在准备工作区、扫描环境并加载你的 Mod 管理器。</p>
      <div class="progress" aria-hidden="true"></div>
      <div class="footer">
        <span class="status">initializing</span>
        <span>By YuiNijika</span>
      </div>
    </section>
  </main>
</body>
</html>
